# Build, push image, and update Cloud Run service on push to main.
#
# Infrastructure (Cloud SQL, secrets, service config) is managed by Terraform
# in infra/. This workflow only rolls out new code by updating the container image.
#
# Setup:
# 1. Run `terraform apply` in infra/ to create all GCP resources (one-time)
# 2. Add GitHub secrets: GCP_SA_KEY (service account JSON)
# 3. Add GitHub vars (optional): GCP_REGION (default: us-central1)

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVICE_NAME: shell-chat-backend
  REPOSITORY: shell-chat

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token

      - name: Configure Docker for Artifact Registry
        run: |
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin "${REGION}-docker.pkg.dev"

      - name: Build and Push
        id: build
        run: |
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          PROJECT="${{ steps.auth.outputs.project_id }}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Update Cloud Run image
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region ${{ vars.GCP_REGION || 'us-central1' }} \
            --image ${{ steps.build.outputs.image }}

      - name: Output URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ vars.GCP_REGION || 'us-central1' }} \
            --format 'value(status.url)')
          echo "Deployed to ${URL}"
